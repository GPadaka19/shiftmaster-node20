<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="15" />
    <meta name="robots" content="noindex" />
    <title>ShiftMaster sedang diperbarui</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
        --brand: #ff6d1f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
          --brand: #ff7a33;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 24rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 32px 24px;
        text-align: center;
      }
      .mark {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--brand);
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true"></span>
      <h1>ShiftMaster sedang diperbarui</h1>
      <p>Biasanya hanya beberapa menit. Halaman ini memuat ulang sendiri.</p>
    </main>
  </body>
</html>
