<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Tidak ada koneksi · Shift Master</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fafafa; color: #18181b;
      }
      main { max-width: 22rem; padding: 2.5rem 1rem; text-align: center; }
      h1 { margin: 0 0 0.25rem; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; }
      p { margin: 0 0 1.5rem; font-size: 0.875rem; line-height: 1.5; color: #71717a; }
      button {
        height: 2.75rem; padding: 0 1rem; border: 0; border-radius: 0.5rem; font: inherit; font-size: 0.875rem;
        font-weight: 500; background: #18181b; color: #fff; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #09090b; color: #fafafa; }
        p { color: #a1a1aa; }
        button { background: #fafafa; color: #18181b; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tidak ada koneksi</h1>
      <p>Shift Master perlu internet untuk menampilkan jadwal terbaru. Periksa koneksimu, lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
