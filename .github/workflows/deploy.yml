name: Deploy

# Merging into production deploys to the VPS. Setup and the list of secrets:
# docs/GO-LIVE.md.

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-shiftmaster-production
  cancel-in-progress: false

jobs:
  # Nothing reaches the VPS unless it builds and the tests pass.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # The image is what runs in production, so build it here too.
      - name: Build Docker image
        run: docker build -t shiftmaster-app:ci .

  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TRAEFIK_NETWORK: ${{ secrets.TRAEFIK_NETWORK }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          BOOTSTRAP_SUPERADMIN_EMAIL: ${{ secrets.BOOTSTRAP_SUPERADMIN_EMAIL }}
          BOOTSTRAP_SUPERADMIN_NICKNAME: ${{ secrets.BOOTSTRAP_SUPERADMIN_NICKNAME }}
          SOURCE_SPREADSHEET_ID: ${{ secrets.SOURCE_SPREADSHEET_ID }}
          SOURCE_READ_RANGE: ${{ secrets.SOURCE_READ_RANGE }}
          M_SOURCE_SPREADSHEET_ID: ${{ secrets.M_SOURCE_SPREADSHEET_ID }}
          M_SOURCE_READ_RANGE: ${{ secrets.M_SOURCE_READ_RANGE }}
          GOOGLE_SHEETS_CLIENT_ID: ${{ secrets.GOOGLE_SHEETS_CLIENT_ID }}
          GOOGLE_SHEETS_CLIENT_SECRET: ${{ secrets.GOOGLE_SHEETS_CLIENT_SECRET }}
          GOOGLE_SHEETS_REFRESH_TOKEN: ${{ secrets.GOOGLE_SHEETS_REFRESH_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for name in APP_HOST POSTGRES_PASSWORD GOOGLE_CLIENT_ID BOOTSTRAP_SUPERADMIN_EMAIL \
                      SOURCE_SPREADSHEET_ID M_SOURCE_SPREADSHEET_ID GOOGLE_SHEETS_CLIENT_ID \
                      GOOGLE_SHEETS_CLIENT_SECRET GOOGLE_SHEETS_REFRESH_TOKEN CRON_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name belum diisi"; exit 1; fi
          done
          umask 077
          {
            printf 'APP_VERSION=git-%s\n' "${GITHUB_SHA::7}"
            printf 'APP_HOST=%s\n' "$APP_HOST"
            printf 'TRAEFIK_NETWORK=%s\n' "${TRAEFIK_NETWORK:-jadwal-lab-upt-net}"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'BOOTSTRAP_SUPERADMIN_EMAIL=%s\n' "$BOOTSTRAP_SUPERADMIN_EMAIL"
            printf 'BOOTSTRAP_SUPERADMIN_NICKNAME=%s\n' "$BOOTSTRAP_SUPERADMIN_NICKNAME"
            printf 'SOURCE_SPREADSHEET_ID=%s\n' "$SOURCE_SPREADSHEET_ID"
            printf 'SOURCE_READ_RANGE=%s\n' "${SOURCE_READ_RANGE:-JADWAL!A1:Z200}"
            printf 'M_SOURCE_SPREADSHEET_ID=%s\n' "$M_SOURCE_SPREADSHEET_ID"
            printf 'M_SOURCE_READ_RANGE=%s\n' "${M_SOURCE_READ_RANGE:-AgendaLab!A1:Z200}"
            printf 'GOOGLE_SHEETS_CLIENT_ID=%s\n' "$GOOGLE_SHEETS_CLIENT_ID"
            printf 'GOOGLE_SHEETS_CLIENT_SECRET=%s\n' "$GOOGLE_SHEETS_CLIENT_SECRET"
            printf 'GOOGLE_SHEETS_REFRESH_TOKEN=%s\n' "$GOOGLE_SHEETS_REFRESH_TOKEN"
            printf 'CRON_SECRET=%s\n' "$CRON_SECRET"
          } > .env

      # Copied to a staging folder and swapped in only after the copy succeeds,
      # so a half-finished transfer cannot break what is running.
      - name: Copy files to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "Dockerfile,docker-compose.yml,.dockerignore,package.json,pnpm-lock.yaml,next.config.ts,tsconfig.json,postcss.config.mjs,components.json,drizzle,public,src,maintenance,scripts,.env"
          target: "~/code/shiftmaster-v2.staging"
          rm: true

      - name: Build and start
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="$HOME/code/shiftmaster-v2"
            STAGING_DIR="$APP_DIR.staging"

            test -f "$STAGING_DIR/docker-compose.yml"
            rm -rf "$APP_DIR.previous"
            if [ -d "$APP_DIR" ]; then mv "$APP_DIR" "$APP_DIR.previous"; fi
            mv "$STAGING_DIR" "$APP_DIR"

            cd "$APP_DIR"
            chmod 600 .env
            chmod +x scripts/backup-db.sh
            sudo docker compose up -d --build --remove-orphans

            # Migrations and first-run setup happen at start; wait for the healthcheck.
            for attempt in $(seq 1 36); do
              status=$(sudo docker inspect --format '{{.State.Health.Status}}' shiftmaster-app 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                echo "shiftmaster-app is healthy"
                sudo docker image prune -f
                exit 0
              fi
              sleep 5
            done
            echo "shiftmaster-app did not become healthy:"
            sudo docker logs --tail 80 shiftmaster-app
            exit 1
