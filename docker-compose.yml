# Production stack on the VPS: the app, its Postgres, and a maintenance page
# Traefik falls back to while the app restarts. Values come from .env in this
# folder (written by .github/workflows/deploy.yml).
#
# Router and container names are new on purpose, so this can run next to the
# old ShiftMaster (ss-upt-*) during the parallel run.

name: shiftmaster

services:
  app:
    build: .
    image: shiftmaster-app:${APP_VERSION:-local}
    container_name: shiftmaster-app
    restart: always
    env_file: .env
    environment:
      TZ: Asia/Jakarta
      DATABASE_URL: postgres://shiftmaster:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diisi}@shiftmaster-db:5432/shiftmaster
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-jadwal-lab-upt-net}"
      - "traefik.http.routers.shiftmaster-v2.rule=Host(`${APP_HOST:?APP_HOST belum diisi}`)"
      - "traefik.http.routers.shiftmaster-v2.entrypoints=websecure"
      - "traefik.http.routers.shiftmaster-v2.tls=true"
      - "traefik.http.routers.shiftmaster-v2.tls.certresolver=cloudflare"
      - "traefik.http.routers.shiftmaster-v2.priority=10"
      - "traefik.http.services.shiftmaster-v2.loadbalancer.server.port=3000"

  db:
    image: postgres:17-alpine
    container_name: shiftmaster-db
    restart: always
    environment:
      TZ: Asia/Jakarta
      POSTGRES_DB: shiftmaster
      POSTGRES_USER: shiftmaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diisi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftmaster -d shiftmaster"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  # Always up. When the app container is down, Traefik drops its router
  # (priority 10) and only this fallback (priority 1) is left.
  maintenance:
    image: nginx:alpine
    container_name: shiftmaster-maintenance
    restart: always
    volumes:
      - ./maintenance:/usr/share/nginx/html:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-jadwal-lab-upt-net}"
      - "traefik.http.routers.shiftmaster-v2-fallback.rule=Host(`${APP_HOST:?APP_HOST belum diisi}`)"
      - "traefik.http.routers.shiftmaster-v2-fallback.entrypoints=websecure"
      - "traefik.http.routers.shiftmaster-v2-fallback.tls=true"
      - "traefik.http.routers.shiftmaster-v2-fallback.tls.certresolver=cloudflare"
      - "traefik.http.routers.shiftmaster-v2-fallback.priority=1"
      - "traefik.http.routers.shiftmaster-v2-fallback.service=shiftmaster-v2-maintenance"
      - "traefik.http.services.shiftmaster-v2-maintenance.loadbalancer.server.port=80"

networks:
  # The network Traefik listens on (shared with the old ShiftMaster).
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-jadwal-lab-upt-net}
  # App ↔ database only; Postgres is never exposed to Traefik or the host.
  internal: {}

volumes:
  pgdata:
    name: shiftmaster-pgdata
