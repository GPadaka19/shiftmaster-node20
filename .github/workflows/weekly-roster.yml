name: Weekly roster

# Every Friday 17:30 WIB (10:30 UTC): ask the app to create and publish next
# week's roster if none exists yet. Scheduled runs only start from the default
# branch (production). A failed run (e.g. no weekly patterns set) fails this
# job, so GitHub emails the repo owner.

on:
  schedule:
    - cron: "30 10 * * 5"
  workflow_dispatch:

jobs:
  trigger:
    name: Create next week's roster
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/weekly-roster
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl -sS --retry 3 --retry-delay 15 --retry-all-errors \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            -w '\n%{http_code}' "https://$APP_HOST/api/cron/weekly-roster")
          code=$(printf '%s' "$response" | tail -n 1)
          printf '%s\n' "$response" | sed '$d'
          if [ "$code" -ge 300 ]; then
            echo "::error::HTTP $code"
            exit 1
          fi
